[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palimpsest"
version = "0.1.0"
description = "Computational literary analysis platform"
requires-python = ">=3.12"
dependencies = [
    "click>=8.0",
    "fastapi>=0.100",
    "uvicorn>=0.20",
    "spacy>=3.7",
    "vaderSentiment>=3.3",
    "scikit-learn>=1.3",
    "numpy>=1.26",
    "scipy>=1.12",
    "pymupdf>=1.23",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "sqlite-vec>=0.1",
    "httpx>=0.25",
    "rich>=13.0",
]

[project.optional-dependencies]
booknlp = ["booknlp>=2.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-xdist>=3.5",
    "pytest-testmon>=2.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
palimpsest = "palimpsest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["palimpsest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["../tests"]
python_files = ["test_*.py"]
# -n auto parallelizes across cores by default (biggest speed lever). Override
# with `-n0` for serial debugging or testmon (see run_tests.sh).
# --dist=loadscope keeps a module/class's tests on one worker so module-scoped
# fixtures (e.g. analyzed_project) are built once per worker, not once per test.
addopts = "--strict-markers -q -n auto --dist=loadscope"
markers = [
    "unit: pure-function test, no spaCy/IO/services (fast)",
    "integration: exercises multiple components end-to-end (ingest + extract)",
    "nlp: loads a spaCy model or runs language analysis",
    "api: exercises the FastAPI server via TestClient",
    "cli: exercises the command-line interface (may shell out)",
    "slow: long-running outlier, excluded from the `fast` subset",
    "external: depends on an external service (Ollama, embeddings)",
    "embeddings: requires the embedding service",
]

[tool.coverage.run]
source = ["palimpsest"]
branch = true
# parallel + xdist: each worker writes its own data file; pytest-cov combines them.
parallel = true
omit = [
    "*/tests/*",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["palimpsest"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true

# Pyright/Pylance config for when the type checker is launched from this directory
# (the workspace-root pyrightconfig.json covers the other launch point). Both point
# at the uv-managed .venv (3.12, the complete environment) and add this dir to the
# search path so the editable-installed `palimpsest` package resolves — its hatchling
# editable hook (.pth) is not something Pyright can execute.
[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
extraPaths = ["."]
