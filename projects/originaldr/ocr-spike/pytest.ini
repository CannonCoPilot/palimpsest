# Isolate the reOCR spike test-suite from the parent palimpsest/core pyproject (which forces pytest-xdist
# flags not installed in ocr-venv). Presence of this file makes ocr-spike the pytest rootdir.
[pytest]
testpaths = tests
addopts = -ra
markers =
    slow: integration test (real MLX / kraken / images) — run with -m slow
